# Sample app: build once and commit the update set on TEST. Runs on every merge
# to main that changes the sample app or the CLI that processes it, and can be
# started by hand. PROD is promoted separately (sample-promote-prod.yml).
name: "Sample app: deploy to TEST"

on:
  push:
    branches: [main]
    paths:
      - 'update-set-cicd-sample/**'
      - 'bin/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/sample-deploy-main.yml'
      - '.github/workflows/_sample-build.yml'
      - '.github/workflows/_import-update-set.yml'
  workflow_dispatch:
    inputs:
      on-conflict:
        description: fail or force (for preview problems)
        type: choice
        options: [fail, force]
        default: fail

concurrency:
  group: sample-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_sample-build.yml

  deploy-test:
    needs: build
    uses: ./.github/workflows/_import-update-set.yml
    with:
      instance: TEST
      on-conflict: ${{ inputs.on-conflict || 'fail' }}
    secrets: inherit
