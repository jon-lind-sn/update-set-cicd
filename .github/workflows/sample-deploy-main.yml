# Sample app: build once, commit on TEST, wait for approval, commit the same
# update set on PROD. Runs on every merge to main that changes the sample or the
# tool that processes it, and can be started by hand.
name: Sample deploy to Prod

on:
  push:
    branches: [main]
    paths:
      - 'update-set-cicd-sample/**'
      - 'bin/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/sample-deploy-main.yml'
      - '.github/workflows/_sample-build.yml'
      - '.github/workflows/_import-update-set.yml'
  workflow_dispatch:
    inputs:
      on-conflict:
        description: fail or force (for preview problems)
        type: choice
        options: [fail, force]
        default: fail

concurrency:
  group: sample-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_sample-build.yml

  deploy-test:
    needs: build
    uses: ./.github/workflows/_import-update-set.yml
    with:
      instance: TEST
      on-conflict: ${{ inputs.on-conflict || 'fail' }}
    secrets: inherit

  approve-prod:
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Manual approval gate
        run: echo "Approved for production"

  deploy-prod:
    needs: approve-prod
    uses: ./.github/workflows/_import-update-set.yml
    with:
      instance: PROD
      on-conflict: ${{ inputs.on-conflict || 'fail' }}
    secrets: inherit
