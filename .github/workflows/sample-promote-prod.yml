# Sample app: promote an update set that TEST already committed to PROD. Started
# by hand. The move job runs in the `production` environment, so a reviewer
# approves it before anything touches PROD. PROD receives the same record a
# manual pull from TEST would copy.
name: "Sample app: promote to PROD"

on:
  workflow_dispatch:
    inputs:
      update-set-name:
        description: 'Update set name as committed on TEST (shown in the summary of the "Sample app: deploy to TEST" run), e.g. Update Set Deploy CICD Sample v0.0.3'
        type: string
        required: true
      on-conflict:
        description: fail or force (for preview problems)
        type: choice
        options: [fail, force]
        default: fail

concurrency:
  group: sample-promote-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    uses: ./.github/workflows/_move-update-sets.yml
    with:
      pattern: ${{ inputs.update-set-name }}
      from: TEST
      to: PROD
      on-conflict: ${{ inputs.on-conflict }}
    secrets: inherit
