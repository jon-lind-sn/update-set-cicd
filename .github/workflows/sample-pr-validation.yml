# Sample app: runs on every pull request. Builds the app and generates the
# update set; touches no instance.
# The generated XML is attached to the run as the `update-set` artifact.
name: "Sample app: PR build and generate"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_sample-build.yml
