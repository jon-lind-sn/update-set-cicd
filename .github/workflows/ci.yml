# CI for the update-set-cicd CLI itself (bin/ and src/).
# Runs unit tests only: no instances, no secrets. The sample Fluent app in
# update-set-cicd-sample/ has its own workflows (see README.md in this folder).
name: "CLI: unit tests"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test
