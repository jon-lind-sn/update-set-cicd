# CI for the update-set-cicd module itself (the CLI in bin/ and src/).
# Runs unit tests only: no instances, no secrets. The sample Fluent app in
# update-set-cicd-sample/ has its own workflows (see README.md in this folder).
name: CI (module)

on:
  pull_request:
    branches: [main]
    paths:
      - 'bin/**'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test
